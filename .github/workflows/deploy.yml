name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  schedule:
    # 每天北京时间凌晨 03:00（UTC 19:00）自动触发拉取远端最新课程资料并部署
    - cron: '0 19 * * *'
  workflow_dispatch: # 随时在 GitHub 网页一键手动触发构建与部署
  repository_dispatch: # 支持由外部课程仓库 Webhook 触发
    types: [ sync-courses, deploy ]

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache remote courses
        uses: actions/cache@v4
        with:
          path: .cache/remote-courses
          key: ${{ runner.os }}-remote-courses-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-remote-courses-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site (Sync remote courses & build)
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_AMAP_KEY: ${{ secrets.PUBLIC_AMAP_KEY || vars.PUBLIC_AMAP_KEY }}
          PUBLIC_AMAP_SECURITY_KEY: ${{ secrets.PUBLIC_AMAP_SECURITY_KEY || vars.PUBLIC_AMAP_SECURITY_KEY }}

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4